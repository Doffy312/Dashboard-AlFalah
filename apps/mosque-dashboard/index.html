    <!-- DNS Prefetch & Preconnect for Google Fonts & External Services -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.aladhan.com" />

    <!-- Google Fonts: Inter & Material Symbols Outlined -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" media="print" onload="this.media='all'" />

    <!-- Inline Critical CSS: Instant background + loading spinner without FOUC -->
    <style>
      html, body { background-color: #0b131a; color: #f8fafc; margin: 0; }
      html:not(.dark), html:not(.dark) body { background-color: #F5ECD7; color: #3B2F20; }
      #root:empty { display: flex; height: 100vh; align-items: center; justify-content: center; }
      #root:empty::after { content: ''; width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #10b981; border-radius: 50%; animation: _s .8s linear infinite; }
      @keyframes _s { to { transform: rotate(360deg); } }
    </style>

    <!-- Schema.org JSON-LD Structured Data for Mosque & Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "PlaceOfWorship",
      "name": "Masjid Al-Falah",
      "description": "Pusat ibadah dan pembinaan kegiatan keagamaan jemaah secara transparan, profesional, dan akuntabel.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Sigi",
        "addressRegion": "Sulawesi Tengah",
        "addressCountry": "ID"
      }
    }
    </script>
